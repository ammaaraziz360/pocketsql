seed: 42
tokenizer_path: artifacts/tokenizers/composition-v9-pilot-bpe.json
canonicalize_identifiers: true
identifier_slot_strategy: permuted
canonicalize_literals: true
layers: 8
hidden_dim: 512
heads: 8
ffn_dim: 2048
context_length: 224
batch_size: 4
grad_accum_steps: 4
learning_rate: 0.0002
warmup_steps: 200
epochs: 15
require_full_sequences: true
generation_max_tokens: 80
early_stopping_patience: 4
early_stopping_min_delta: 0.0
validation_execution_every: 1
validation_execution_max_examples: 240
validation_execution_batch_size: 8
validation_checkpoint_metric: execution_accuracy
