seed: 42
tokenizer_path: artifacts/tokenizers/position-robust-v8-bpe.json
model_architecture: structured_v18
structured_plan_mode: replace
factorized_schema_mode: disabled
canonicalize_identifiers: true
identifier_slot_strategy: permuted
canonicalize_literals: true
schema_linking_hints: false
factorized_schema_linking_hints: false
schema_linking_max_tables: 8
schema_linking_max_columns: 16
target_format: semantic_plan
constrain_semantic_plan: true
layers: 8
hidden_dim: 512
heads: 8
ffn_dim: 2048
context_length: 416
max_table_slots: 16
max_column_slots: 32
max_projection_slots: 4
max_filter_slots: 4
max_group_slots: 2
max_literal_span_tokens: 32
max_limit_value: 6
train_schema_heads_only: false
language_loss_weight: 0.25
schema_link_loss_weight: 1.0
operation_loss_weight: 1.0
literal_loss_weight: 1.0
batch_size: 4
grad_accum_steps: 4
learning_rate: 0.000003
warmup_steps: 25
epochs: 2
require_full_sequences: true
generation_max_tokens: 96
early_stopping_patience: 1
early_stopping_min_delta: 0.0
validation_execution_every: 1
validation_execution_max_examples: 1548
validation_execution_batch_size: 8
validation_checkpoint_metric: execution_accuracy
