[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsql"
version = "0.1.0"
description = "A locally trained MLX text-to-SQL model for SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.22.0",
  "PyYAML>=6.0",
  "tensorboard>=2.16",
  "tokenizers>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
